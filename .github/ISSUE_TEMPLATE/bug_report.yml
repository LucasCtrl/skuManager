name: Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behaviour
      description: What you expected to happen instead.
  - type: input
    attributes:
      label: App version
      description: Shown on the Settings page.
      placeholder: v0.0.1
    validations:
      required: true
  - type: input
    attributes:
      label: Database version
      description: Shown on the Settings page.
      placeholder: v0.0.1
    validations:
      required: true
  - type: dropdown
    attributes:
      label: OS
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true
  - type: input
    attributes:
      label: OS version
      placeholder: Windows 11 23H2, Ubuntu 24.04, macOS 15.1
    validations:
      required: true
  - type: textarea
    attributes:
      label: Screenshots / logs
      description: Optional. Remove product data you do not want to share.
